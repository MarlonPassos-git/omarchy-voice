name: Publish reviewed voice pipeline

on:
  push:
    branches: [feat/local-voice-pipeline]
    paths: [.github/workflows/publish-local-voice.yml]

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'MarlonPassos-git/omarchy-voice'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and apply tested source patch
        shell: python
        run: |
          import hashlib, subprocess
          from pathlib import Path
          parts = sorted(Path('.github/voice-patch').glob('*.txt'))
          assert len(parts) == 15
          patch = b''.join(path.read_bytes() for path in parts)
          assert hashlib.sha256(patch).hexdigest() == 'c8acd6658ddfd64f5b101a40fda7769b57efd8a9a1336a34762659dfc0f60191'
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip() == '2e6facc085877ef1ae251f02a83ea354718df32b'
          path = Path('/tmp/local-voice.patch')
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(path)], check=True)
          subprocess.run(['git', 'apply', str(path)], check=True)
      - name: Validate implementation
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -v
          python -m compileall -q src
          bash -n install.sh
          git diff --check
      - name: Commit implementation and remove one-time publisher
        run: |
          git rm -r .github/voice-patch .github/workflows/publish-local-voice.yml
          git add README.md docs/PROVIDERS.md install.sh omarchy/bin/omarchy-voice-{setup,models,speak} plugin/voice.indicator/VoiceIndicator.qml share/*.toml src/omarchy_voice/*.py tests/*.py
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: add configurable local and hybrid voice pipeline'
          git push origin HEAD:refs/heads/feat/local-voice-pipeline
